[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-gate-editor-reference"
version = "0.1.0"
license = {file = "LICENSE"}
readme = "README.md"
description = "Configurable research implementation of the MAS-Gate Runtime Editor"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2",
  "transformers>=4.51",
  "peft>=0.12",
  "accelerate>=0.30",
  "openai>=1.50",
]

[tool.setuptools.packages.find]
include = ["gate_main*", "gate_baselines*"]
